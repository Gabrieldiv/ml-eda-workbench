datasets:
  wine:
    separator: ","
    encoding: "utf-8"
    id_column: "id"
    target_column: "diagnostico"
  
  titanic_train:
    separator: ","
    encoding: "utf-8"
    id_column: "PassengerId"
    target_column: "Survived"
    # Grouping columns in this CSV (not inferred). Pclass = ticket class 1/2/3.
    protected_attributes: [Sex, Pclass]
    eval_path: null  # e.g. data/titanic_eval.csv — NOT the profiled file
    predictions_path: null  # e.g. data/titanic_eval_predictions.csv
    model_path: null  # e.g. data/titanic_model.joblib
  
  iris:
    separator: ","
    encoding: "utf-8"
    id_column: null
    target_column: "specie"

data:
  # Path to the directory containing your datasets
  path: "data/"
  # Name of the training CSV file (place it inside data/)
  train_file: "train.csv"
  # Name of the test / hold-out CSV file
  test_file: "test.csv"
  # Name of the column you are trying to predict
  target_column: "target"

experiment:
  # Seed used for all random operations — change to get different splits
  random_seed: 42
  # Fraction of data held out for evaluation (0.2 = 20%)
  test_size: 0.2
  # Number of folds used for cross-validation
  cv_folds: 5

correlation:
  # Pearson correlation threshold (absolute value) above which two
  # characteristics are considered redundant. Flags a candidate for
  # manual review — not an automatic removal decision (see the
  # report's "Candidate for Review" section for the heuristic used).
  drop_threshold: 0.9
  # Minimum number of overlapping non-null rows required to trust a
  # pairwise correlation. Pairs with fewer valid rows are reported as
  # insufficient data instead of being evaluated against drop_threshold.
  min_pairwise_n: 30
    # Which correlation plot(s) to generate: "heatmap", "violin", or "both".
  plot_mode: "both"

data_types:
  # Numeric characteristics with this many or fewer distinct values are
  # flagged as potentially categorical/ordinal codes (binary flags, IDs,
  # counts) rather than continuous measures, since IQR outlier detection
  # and Pearson correlation may not be statistically meaningful for them.
  low_cardinality_threshold: 10

outliers:
  # Boxplot outlier factor — how many IQRs beyond Q1/Q3 count as an
  # outlier. The conventional value is 1.5.
  outlier_factor: 1.5


plots:
  # Default figure size in inches [width, height]
  figure_size: [12, 6]
  # Matplotlib style — see https://matplotlib.org/stable/gallery/style_sheets/
  style: "seaborn-v0_8-whitegrid"
  # Dots per inch for saved figures
  dpi: 150
  # Directory where figures are saved by helper utilities
  save_dir: "outputs/figures/"


profiling:
  # Set to true for a faster (less detailed) ydata-profiling report
  minimal: false
  # Output path for the HTML profiling report
  output_file: "outputs/profile_report.html"

bias:
  # summary: findings + compact tables; full tables in a collapsible breakdown
  # full: expand every coverage / metric / SHAP table
  report_detail: summary
  # Group is underrepresented when n is below this count
  min_group_count: 30
  # Group is underrepresented when its share of rows is below this fraction
  min_group_share: 0.05
  # Intersectional combination is sparse when its share is below this fraction
  sparse_intersection_share: 0.01
  # Flag rate gaps (demographic parity, equal opportunity, accuracy) above this
  rate_difference_threshold: 0.1
  # Flag demographic-parity ratio below this value (four-fifths rule: 0.8)
  disparate_impact_threshold: 0.8
  # Background sample size passed to shap.Explainer
  shap_background_size: 50
  # Number of eval rows to explain
  shap_explain_size: 100
  # Flag features whose mean SHAP differs across groups by more than this
  shap_attribution_gap_threshold: 0.1
