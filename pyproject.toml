[project]
name = "ml-eda-workbench"
version = "0.1.0"
description = "ML/EDA workbench for exploratory data analysis and feature investigation"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ipykernel>=6.29",
    "jupyter>=1.1",
    "matplotlib>=3.9",
    "numpy>=2.0",
    "pandas>=2.2",
    "plotly>=5.24",
    "pyyaml>=6.0",
    "scikit-learn>=1.5",
    "scipy>=1.14",
    "seaborn>=0.13",
    "sweetviz>=2.3",
    "tzdata>=2024.1",
    "ydata-profiling>=4.10",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eda_workbench"]

# ---------------------------------------------------------------------------
# Ruff — linter + formatter
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 88
target-version = "py313"
src = ["src"]
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "*.egg-info",
    "notebooks",
]

[tool.ruff.lint]
# E/W: pycodestyle  F: pyflakes  I: isort  UP: pyupgrade
# PD: pandas-vet    NPY: numpy    N: pep8-naming
select = ["E", "W", "F", "I", "UP", "PD", "NPY", "N"]
ignore = [
    "E501",   # line too long — formatter handles this
]
fixable = ["ALL"]

[tool.ruff.lint.isort]
known-first-party = ["eda_workbench"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

# ---------------------------------------------------------------------------
# Pytest + coverage
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--cov=src",
    "--cov-report=xml",
    "--cov-report=term-missing",
    "-v",
]

[tool.coverage.run]
source = ["src"]
branch = true
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
